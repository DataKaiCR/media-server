# DataKai media stack
#
# Design invariants:
#   * Every downloader and *arr service shares one /data mount so imports can
#     use hardlinks instead of full copies.
#   * qBittorrent shares Gluetun's network namespace. No VPN means no network.
#   * Images are pinned and logs are rotated.
#   * The stack is designed for rootful Podman with SELinux enforcing and an
#     NVIDIA CDI device available to Jellyfin.
#
# Copy .env.example to .env before running Compose. Never commit .env.

networks:
  media:
    driver: bridge

x-common: &common
  restart: unless-stopped
  environment: &env
    PUID: "${PUID:-1000}"
    PGID: "${PGID:-1000}"
    TZ: "${TZ:-UTC}"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ---------------------------------------------------------------- VPN ----
  # Owns the network namespace for qBittorrent. Killswitch is inherent: if
  # gluetun stops, the container sharing its namespace has no route out.
  gluetun:
    # OPT-IN. Not started by a plain "up -d" — requires --profile download.
    profiles: ["download"]
    image: docker.io/qmcgaw/gluetun:v3.40.0
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    networks: [media]
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-8090}:8080" # published here, not on qBittorrent
      - "${TORRENT_PORT:-6881}:6881/tcp"
      - "${TORRENT_PORT:-6881}:6881/udp"
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_PROVIDER}"
      VPN_TYPE: "${VPN_TYPE:-wireguard}"
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES}"
      SERVER_COUNTRIES: "${VPN_COUNTRIES}"
      # Only connect to servers that support port forwarding. On ProtonVPN
      # those are the P2P servers, so this also guarantees a P2P-capable exit
      # without hand-picking one. A non-P2P exit fails silently: the tunnel
      # comes up healthy and torrents simply never move.
      PORT_FORWARD_ONLY: "on"
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_STATUS_FILE: "/gluetun/forwarded_port"
      # Proton's forwarded port is dynamic (NAT-PMP) and changes on reconnect.
      # gluetun runs this each time it acquires one; the script pushes it into
      # qBittorrent, which shares this container's network namespace.
      VPN_PORT_FORWARDING_UP_COMMAND: "/bin/sh /gluetun/update-qbt-port.sh {{PORTS}}"
      # Let explicitly configured local clients reach the WebUI.
      FIREWALL_OUTBOUND_SUBNETS: "${LAN_SUBNETS:-192.168.1.0/24}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ${APPDATA}/gluetun:/gluetun
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qbittorrent:
    # OPT-IN alongside gluetun. Cannot start without it: network_mode binds this
    # container to gluetun's namespace, so no tunnel means no network at all.
    profiles: ["download"]
    image: lscr.io/linuxserver/qbittorrent:5.0.4
    container_name: qbittorrent
    # Shares gluetun's netns — this is the killswitch.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *env
      WEBUI_PORT: "8080"
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${DATA}:/data           # single mount: /data/torrents + /data/media
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ------------------------------------------------------------ indexers ----
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:1.30.2
    container_name: prowlarr
    networks: [media]
    ports: ["9696:9696"]
    volumes:
      - ${APPDATA}/prowlarr:/config

  # -------------------------------------------------------------- *arrs ----
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: radarr
    networks: [media]
    ports: ["7878:7878"]
    volumes:
      - ${APPDATA}/radarr:/config
      - ${DATA}:/data

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: sonarr
    networks: [media]
    ports: ["8989:8989"]
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${DATA}:/data

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    networks: [media]
    ports: ["6767:6767"]
    volumes:
      - ${APPDATA}/bazarr:/config:Z
      - ${DATA}:/data
      - ./scripts/mark-generated-subtitle.py:/opt/media-scripts/mark-generated-subtitle.py:ro,z

  # Human subtitle providers remain primary. Bazarr calls this internal-only
  # service only when its governed Whisper fallback is explicitly allowed.
  whisper:
    <<: *common
    image: docker.io/onerahmet/openai-whisper-asr-webservice:v1.9.1-gpu
    container_name: whisper
    networks: [media]
    expose: ["9000"]
    devices:
      - nvidia.com/gpu=all
    environment:
      <<: *env
      ASR_ENGINE: "faster_whisper"
      ASR_MODEL: "${WHISPER_MODEL:-medium}"
      ASR_DEVICE: "cuda"
      ASR_QUANTIZATION: "float16"
      ASR_MODEL_PATH: "/models"
      MODEL_IDLE_TIMEOUT: "${WHISPER_IDLE_TIMEOUT:-600}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - ${WHISPER_CACHE}:/models:Z
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m

  # --------------------------------------------------------- media server ----
  # CloudFlare challenge solver for public indexers that gate search behind an
  # interstitial (1337x, EZTV). Prowlarr routes tagged indexers through it.
  # Not part of the download half: it solves challenges, it does not fetch content.
  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    container_name: flaresolverr
    networks: [media]
    # Chrome is unstable on podman's default 64M /dev/shm; the symptom is a
    # generic 60s challenge-solve timeout, not an obvious memory error.
    shm_size: "512mb"
    environment:
      <<: *env
      LOG_LEVEL: "info"
      TZ: "${TZ:-UTC}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jellyfin:
    <<: *common
    image: lscr.io/linuxserver/jellyfin:10.10.3
    container_name: jellyfin
    networks: [media]
    ports:
      - "8096:8096"          # http
      - "8920:8920"          # https
      - "7359:7359/udp"      # client discovery
    devices:
      - nvidia.com/gpu=all   # NVENC/NVDEC through NVIDIA CDI (rootful)
    environment:
      <<: *env
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
    volumes:
      - ${APPDATA}/jellyfin:/config
      - ${DATA}/media:/data/media:ro          # read-only: Jellyfin never writes here
      - ${TRANSCODE}:/config/transcodes       # scratch on NVMe, not the HDD

  jellyseerr:
    <<: *common
    image: docker.io/fallenbagel/jellyseerr:2.1.0
    container_name: jellyseerr
    networks: [media]
    ports: ["5055:5055"]
    volumes:
      - ${APPDATA}/jellyseerr:/app/config

  # Dedicated request portal whose Radarr default requires Latin American
  # Spanish audio. It shares the main Jellyfin and Radarr instances; keeping
  # request policy in a separate portal avoids brittle per-user database hooks.
  jellyseerr-latino:
    <<: *common
    image: docker.io/fallenbagel/jellyseerr:2.1.0
    container_name: jellyseerr-latino
    networks: [media]
    ports: ["5056:5055"]
    volumes:
      - ${APPDATA}/jellyseerr-latino:/app/config:Z
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-media-server_media}"
      traefik.http.routers.jellyseerr-latino.rule: "Host(`${LATINO_REQUEST_HOST:-latino.example.internal}`)"
      traefik.http.routers.jellyseerr-latino.entrypoints: "web"
      traefik.http.services.jellyseerr-latino.loadbalancer.server.port: "5055"
