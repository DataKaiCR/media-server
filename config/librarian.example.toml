version = 1
report_dir = "/srv/private-state/librarian/reports"

[audiovisual_analysis]
enabled = true
parser_timeout_seconds = 30
max_parser_output_bytes = 4194304
max_parser_memory_bytes = 1073741824
subtitle_max_bytes = 8388608
large_file_bytes = 21474836480
high_bitrate_bits_per_second = 40000000
subtitle_runtime_tolerance_seconds = 30

[book_analysis]
pdf_text_layer = true
pdf_sample_pages = 12
parser_timeout_seconds = 30
max_parser_output_bytes = 1048576
max_parser_memory_bytes = 1073741824

[photo_analysis]
enabled = true
location_detail = "presence"
quality_signals = true
perceptual_duplicates = true
near_duplicate_distance = 4
burst_window_seconds = 2
burst_max_span_seconds = 15
parser_timeout_seconds = 20
max_parser_memory_bytes = 1073741824
max_image_pixels = 50000000

[[collections]]
id = "movie-library"
kind = "audiovisual"
role = "library"
media_layout = "movies"
root = "/srv/collections/media/movies"
exclude_globs = ["@eaDir/**"]

[[collections]]
id = "series-library"
kind = "audiovisual"
role = "library"
media_layout = "series"
root = "/srv/collections/media/series"
exclude_globs = ["@eaDir/**"]

[[collections]]
id = "primary-photos"
kind = "photos"
role = "library"
root = "/srv/collections/photos"
exclude_globs = [".thumbnails/**", "@eaDir/**"]

[[collections]]
id = "digital-books"
kind = "books"
role = "library"
root = "/srv/collections/books"
exclude_globs = [".caltrash/**"]

# Populate this directory through an explicit phone export. Auditing only records
# stable source hashes; it never imports or deletes intake files.
[[collections]]
id = "phone-book-intake"
kind = "books"
role = "intake"
root = "/srv/private-intake/books-from-phone"
exclude_globs = []
